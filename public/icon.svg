<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#262626" stroke-width="4" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="6" />

  <!-- Shield / Wallet Card outline -->
  <rect x="96" y="116" width="320" height="280" rx="40" fill="#171717" stroke="url(#emeraldGrad)" stroke-width="12" />
  
  <!-- Accent flap / top highlight -->
  <path d="M 96 180 L 416 180" stroke="#262626" stroke-width="6" />
  <circle cx="360" cy="256" r="22" fill="url(#emeraldGrad)" />

  <!-- Stylized Rupee / "M R" symbol in emerald -->
  <!-- Top horizontal bar -->
  <rect x="160" y="210" width="130" height="16" rx="8" fill="url(#emeraldGrad)" />
  <!-- Second horizontal bar -->
  <rect x="160" y="246" width="105" height="16" rx="8" fill="url(#emeraldGrad)" />
  <!-- Vertical stem -->
  <rect x="180" y="210" width="18" height="110" rx="9" fill="url(#emeraldGrad)" />
  <!-- Upper curve -->
  <path d="M 198 210 Q 285 228 285 264 Q 285 300 198 300" fill="none" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linecap="round" />
  <!-- Diagonal leg -->
  <line x1="220" y1="295" x2="280" y2="365" stroke="url(#emeraldGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Small MR badge in bottom corner -->
  <text x="256" y="445" text-anchor="middle" fill="#a3a3a3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="4">MR EXPENSE</text>
</svg>
